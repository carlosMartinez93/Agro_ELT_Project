name: CD - Daily ELT (Ingestion + dbt)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC (~07:00 Brasil)

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/agro_elt
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (ingestion + dbt)
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Run weather ingestion (Open-Meteo -> Bronze)
        env:
          DAYS_BACK: "30"
        run: python ingestion/run_weather_ingestions.py

      - name: dbt build (seeds, models, tests)
        working-directory: dbt/agro_elt
        run: dbt build

      - name: dbt source freshness (fuel price mirror)
        working-directory: dbt/agro_elt
        run: dbt source freshness --select source:basedosdados